services:
  backend:
    build: .
    container_name: passai_backend_container
    ports:
      - "5000:5000"
    env_file:
      - ./.env

  frontend:
    build: ./frontend
    container_name: passai_frontend_container
    ports:
      - "5173:80"
    depends_on:
      - backend
  redis:
    image: redis:7
    container_name: redis_container
    ports:
      - "6379:6379"
    depends_on:
      - backend

networks:
  default:
    driver: bridge